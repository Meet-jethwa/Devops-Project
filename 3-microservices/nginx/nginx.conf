# Nginx presentation tier: it serves the unchanged frontend and proxies APIs.
# It exists so browsers never need to know private service addresses.
# Analogy: this is the receptionist who forwards requests to the right room.
events {}
http {
  include /etc/nginx/mime.types;
  upstream gateway { server gateway:8000; }
  server {
    listen 80;
    root /usr/share/nginx/html;
    location = / { index index.html; }
    location = /chat { rewrite ^ /chat.html break; }
    location /static/ {
      # The Compose mount places app/static files directly in this directory.
      alias /usr/share/nginx/html/;
    }
    location /api/ {
      proxy_pass http://gateway;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $http_x_request_id;
      proxy_connect_timeout 3s;
      proxy_read_timeout 5s;
    }
  }
}
