# Phase 2 three-tier deployment: Nginx, FastAPI logic, and PostgreSQL data.
services:
  presentation:
    image: nginx:1.27-alpine
    ports:
      - "${PRESENTATION_PORT:-8080}:80"
    volumes:
      - ../app/static:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      logic:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  logic:
    build:
      context: ..
      dockerfile: 2-three-tier/logic/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-floraai}:${POSTGRES_PASSWORD:-change-me}@data:5432/${POSTGRES_DB:-floraai}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    depends_on:
      data:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  data:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-floraai}
      POSTGRES_USER: ${POSTGRES_USER:-floraai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - three-tier-postgres-data:/var/lib/postgresql/data
      - ./data/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  three-tier-postgres-data:
