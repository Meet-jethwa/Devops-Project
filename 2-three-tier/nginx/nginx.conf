# Nginx presentation tier: unchanged files are served from /usr/share/nginx/html.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Keep the existing frontend entry points available without changing them.
    location = / {
        index index.html;
    }

    location = /chat {
        rewrite ^ /chat.html break;
    }

    location /static/ {
        # The Compose mount places app/static files directly in this directory.
        # Strip the /static/ URL prefix before looking up the mounted file.
        alias /usr/share/nginx/html/;
    }

    # Browser API calls remain same-origin while the logic tier stays private.
    location /api/ {
        proxy_pass http://logic:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
